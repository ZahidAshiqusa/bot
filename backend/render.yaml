# ==============================================================================
# Render Blueprint Specification for Standalone Backend Directory (/backend)
# ZAID ASHIQ STUDIO - WhatsApp Bot & Control Panel
# ==============================================================================

services:
  - type: web
    name: zaid-ashiq-bot-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_ID
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_GIST_ID
        sync: false
      - key: ADMIN_NUMBER
        sync: false
